# Builds FoldAmp and regenerates the rebranded skins on all three desktop platforms, so the README's
# instructions stay honest for macOS, Linux and Windows.
name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check the rebranded skins are up to date
        run: |
          python -m pip install Pillow
          python scripts/rebrand_skins.py --check
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: foldamp-apks
          path: app/build/outputs/apk/**/*.apk
